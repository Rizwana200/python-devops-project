<!doctype html>
<html>

<head>

  <title>
    {% block title %}InfraMonitor{% endblock %}
  </title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <link
    href="/static/css/main.css"
    rel="stylesheet"
  />

  <link
    href="/static/img/favicon.ico"
    rel="icon"
  />

  <link
    rel="stylesheet"
    href="https://stackpath.bootstrapcdn.com/bootswatch/4.5.2/united/bootstrap.min.css"
    integrity="sha384-JW3PJkbqVWtBhuV/gsuyVVt3m/ecRJjwXC3gCXlTzZZV+zIEEl6AnryAriT7GWYm"
    crossorigin="anonymous"
  />

</head>


<body>

  <!-- NAVIGATION -->

  <nav class="navbar navbar-dark bg-primary">

    <a
      class="navbar-brand logotext"
      href="/"
    >
      <strong>InfraMonitor</strong>
    </a>

  </nav>


  <!-- MAIN CONTENT -->

  <div class="container body-content">

    {% block content %}
    {% endblock %}

  </div>


  <!-- JAVASCRIPT -->

  <script
    src="https://code.jquery.com/jquery-3.5.1.min.js"
    integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0="
    crossorigin="anonymous"
  ></script>

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"
    crossorigin="anonymous"
  ></script>

  <script
    src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"
    crossorigin="anonymous"
  ></script>

</body>

</html>
